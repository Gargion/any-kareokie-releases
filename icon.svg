  <rect x="0" y="0" width="64" height="64" rx="14" fill="#0f1117"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#2a2f3c" stroke-width="1.5"/>
  <g transform="translate(1 0)">
    <rect x="8" y="26" width="6" height="12" rx="3" fill="#ff7a45"/>
    <rect x="16" y="20" width="6" height="24" rx="3" fill="#ff7a45"/>
    <rect x="24" y="14" width="6" height="36" rx="3" fill="#ff7a45"/>
    <rect x="32" y="10" width="6" height="20" rx="3" fill="#3fd0ff"/>
    <rect x="32" y="34" width="6" height="20" rx="3" fill="#ff7a45"/>
    <rect x="40" y="14" width="6" height="36" rx="3" fill="#3fd0ff"/>
    <rect x="48" y="20" width="6" height="24" rx="3" fill="#3fd0ff"/>
  </g>
</svg>
